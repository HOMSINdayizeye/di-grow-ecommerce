services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: infrastructure/docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/digrow
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in infrastructure/.env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      SITE_URL: ${SITE_URL:-https://digrow.rw}
      UPLOADS_BASE_URL: /api/uploads
      ADMIN_NAME: ${ADMIN_NAME:-Admin User}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@digrow.rw}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in infrastructure/.env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Di-Grow <no-reply@digrow.rw>}
    volumes:
      - uploads:/app/backend/uploads

  frontend:
    build:
      context: ..
      dockerfile: infrastructure/docker/frontend.Dockerfile
      args:
        VITE_USE_MOCK: "false"
        VITE_API_URL: /api
        VITE_SOCKET_URL: ""
        VITE_SITE_URL: ${SITE_URL:-https://digrow.rw}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo-data:
  uploads:

# First run: copy infrastructure/.env.example to infrastructure/.env, set JWT_SECRET and
# ADMIN_PASSWORD, then:
#   docker compose up -d --build
#   docker compose exec backend node src/seed/seed.js
